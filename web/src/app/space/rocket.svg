<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <!-- thân trụ trắng: sáng ở trên, tối dần xuống dưới để có khối tròn -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" /><stop offset="0.45" stop-color="#eef1f6" /><stop offset="1" stop-color="#9aa4b5" />
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e5a" /><stop offset="0.5" stop-color="#22242c" /><stop offset="1" stop-color="#0c0d12" />
    </linearGradient>
  </defs>

  <!-- chân đáp gập dọc thân -->
  <path d="M46 20 h30 l-26 -7 z" fill="url(#dark)" />
  <path d="M46 36 h30 l-26 7 z" fill="url(#dark)" />

  <!-- loa phụt -->
  <path d="M40 22 l-10 -3 v18 l10 -3 z" fill="url(#dark)" />

  <!-- tầng một, khoang nối tầng màu đen, tầng hai -->
  <rect x="40" y="20" width="148" height="16" fill="url(#body)" />
  <rect x="40" y="20" width="9" height="16" fill="url(#dark)" />
  <rect x="120" y="20" width="15" height="16" fill="url(#dark)" />

  <!-- cánh lưới gần khoang nối tầng -->
  <rect x="112" y="13" width="7" height="7" rx="1" fill="url(#dark)" />
  <rect x="112" y="36" width="7" height="7" rx="1" fill="url(#dark)" />

  <!-- chụp mũi rộng hơn thân -->
  <path d="M186 20 l5 -3 h15 q22 2 32 11 q-10 9 -32 11 h-15 l-5 -3 z" fill="url(#body)" />

  <!-- đường nối tấm vỏ -->
  <g stroke="#b9c1cf" stroke-width="0.8" fill="none">
    <path d="M70 20 v16 M96 20 v16 M150 20 v16 M172 20 v16 M206 17 v22" />
    <path d="M49 28 h71 M135 28 h51" opacity="0.5" />
  </g>
</svg>
